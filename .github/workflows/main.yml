name: Deploy Zonix Pharma (zonixpharma.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pharma-main
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deploy (zonixpharma.com)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend assets
        run: npm ci && npm run production

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, pdo_sqlite, bcmath
          coverage: none
          tools: composer

      - name: Prepare Laravel for tests
        run: cp .env.example .env

      - name: Install PHP dependencies (with dev, for tests)
        run: composer install --optimize-autoloader --no-interaction

      - name: Generate app key for tests
        run: php artisan key:generate --force

      - name: Run tests before deploy
        run: php artisan test --parallel

      - name: Setup production environment file
        run: |
          echo "Setting up .env from GitHub secret ENV_CONTENT..."
          echo "${{ secrets.ENV_CONTENT }}" > .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's|APP_URL=.*|APP_URL=https://zonixpharma.com|' .env
          # Dotenv exige comillas si el valor tiene espacios (ej. APP_NAME=Zonix Pharma)
          if grep -qE '^APP_NAME=[^"\047].*[[:space:]]' .env; then
            sed -i 's/^APP_NAME=\(.*\)$/APP_NAME="\1"/' .env
          fi
          if ! grep -q '^APP_KEY=.\+' .env; then
            php artisan key:generate --force
          fi
          echo ".env configured (contents hidden)"

      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Clear Laravel caches
        run: |
          php artisan config:clear || true
          php artisan cache:clear || true
          php artisan route:clear || true
          php artisan view:clear || true

      - name: Remove cached config files
        run: |
          rm -f bootstrap/cache/config.php
          rm -f bootstrap/cache/routes-v7.php
          rm -f bootstrap/cache/services.php

      - name: Create required directories
        run: |
          mkdir -p storage/logs
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p bootstrap/cache

      - name: Remove individual CoreUI SVGs before FTP
        run: rm -rf public/icons/svg

      - name: Strip dev-only files before FTP
        run: |
          rm -rf .git
          rm -rf resources/assets
          rm -f _ide_helper.php _ide_helper_models.php
          rm -f .env.example phpunit.xml phpstan.neon.dist pint.json
          rm -f webpack.mix.js package.json package-lock.json

      - name: FTP deploy
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 1200000
          state-name: zonixpharma-ftp-deploy-state
          log-level: minimal
          exclude: |
            **/.git/**
            **/.git*
            **/_ide_helper*
            **/.cursor*
            **/.editorconfig
            **/.env.example
            **/phpunit.xml
            **/phpstan*
            **/pint.json
            **/resources/assets/**
            **/resources/js/**
            **/resources/sass/**
            **/webpack.mix.js
            **/package.json
            **/package-lock.json
            **/.github/**
            **/node_modules/**
            vendor/**
            **/public/icons/svg/**
            **/storage/app/public/**
            **/storage/logs/**
            **/tests/**
            **/.agents/**
            **/.specify/**
            **/specs/**
            **/docs/**

      # Namecheap shared often closes long FTP sessions (FIN packet). Retry finishes incremental upload.
      - name: FTP deploy retry
        if: steps.ftp_deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 1200000
          state-name: zonixpharma-ftp-deploy-state
          log-level: minimal
          exclude: |
            **/.git/**
            **/.git*
            **/_ide_helper*
            **/.cursor*
            **/.editorconfig
            **/.env.example
            **/phpunit.xml
            **/phpstan*
            **/pint.json
            **/resources/assets/**
            **/resources/js/**
            **/resources/sass/**
            **/webpack.mix.js
            **/package.json
            **/package-lock.json
            **/.github/**
            **/node_modules/**
            vendor/**
            **/public/icons/svg/**
            **/storage/app/public/**
            **/storage/logs/**
            **/tests/**
            **/.agents/**
            **/.specify/**
            **/specs/**
            **/docs/**

      - name: Set directory permissions
        run: |
          chmod -R 755 storage bootstrap/cache
          chmod 600 .env

      - name: Create storage link
        run: php artisan storage:link || echo "Storage link skipped on runner"

      - name: Verify deployment
        run: |
          echo "Verifying https://zonixpharma.com ..."
          curl -fsS --retry 3 --retry-delay 5 \
            https://zonixpharma.com/api/ping \
            || echo "WARN: /api/ping not reachable yet (first deploy may need migrate + docroot)"
