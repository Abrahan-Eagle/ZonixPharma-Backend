name: Deploy Zonix Pharma (zonixpharma.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pharma-main
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP deploy (zonixpharma.com)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend assets
        run: npm ci && npm run production

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, pdo_sqlite, bcmath
          coverage: none
          tools: composer

      - name: Prepare Laravel for tests
        run: cp .env.example .env

      - name: Install PHP dependencies (with dev, for tests)
        run: composer install --optimize-autoloader --no-interaction

      - name: Generate app key for tests
        run: php artisan key:generate --force

      - name: Run tests before deploy
        run: php artisan test --parallel

      - name: Setup production environment file
        run: |
          echo "Setting up .env from GitHub secret ENV_CONTENT..."
          echo "${{ secrets.ENV_CONTENT }}" > .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's|APP_URL=.*|APP_URL=https://zonixpharma.com|' .env
          # Dotenv exige comillas si el valor tiene espacios (ej. APP_NAME=Zonix Pharma)
          if grep -qE '^APP_NAME=[^"\047].*[[:space:]]' .env; then
            sed -i 's/^APP_NAME=\(.*\)$/APP_NAME="\1"/' .env
          fi
          if ! grep -q '^APP_KEY=.\+' .env; then
            php artisan key:generate --force
          fi
          echo ".env configured (contents hidden)"

      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Clear Laravel caches
        run: |
          php artisan config:clear || true
          php artisan cache:clear || true
          php artisan route:clear || true
          php artisan view:clear || true

      - name: Remove cached config files
        run: |
          rm -f bootstrap/cache/config.php
          rm -f bootstrap/cache/routes-v7.php
          rm -f bootstrap/cache/services.php

      - name: Create required directories
        run: |
          mkdir -p storage/logs
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p bootstrap/cache

      - name: Remove individual CoreUI SVGs before FTP
        run: rm -rf public/icons/svg

      # Patrón CorralX (W41-02): no subir .env por FTP; se administra en el hosting.
      - name: Remove local env files before FTP
        run: rm -f .env .env.testing

      # FTP alineado a CorralX-Backend: v4.4.0; vendor/ SÍ se sube (composer --no-dev en runner).
      # Extra Zonix: tests/docs/agents/specs, icons/svg. Retry + cooldown ante FIN/ECONNREFUSED Namecheap.
      - name: FTP-Deploy-Action
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          timeout: 1200000
          state-name: zonixpharma-ftp-deploy-state
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/public/storage
            **/public/storage/**
            **/tests/**
            **/.agents/**
            **/.specify/**
            **/specs/**
            **/docs/**
            **/.github/**
            **/public/icons/svg/**
            **/_ide_helper*
            **/.cursor*

      - name: Wait before FTP retry
        if: steps.ftp_deploy.outcome == 'failure'
        run: |
          echo "Cooldown 3m after FIN/ECONNREFUSED..."
          sleep 180

      - name: FTP-Deploy-Action retry
        id: ftp_retry
        if: steps.ftp_deploy.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          timeout: 1200000
          state-name: zonixpharma-ftp-deploy-state
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/public/storage
            **/public/storage/**
            **/tests/**
            **/.agents/**
            **/.specify/**
            **/specs/**
            **/docs/**
            **/.github/**
            **/public/icons/svg/**
            **/_ide_helper*
            **/.cursor*

      - name: Wait before FTP retry 2
        if: steps.ftp_deploy.outcome == 'failure' && steps.ftp_retry.outcome == 'failure'
        run: |
          echo "Cooldown 3m before second retry..."
          sleep 180

      - name: FTP-Deploy-Action retry 2
        if: steps.ftp_deploy.outcome == 'failure' && steps.ftp_retry.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          timeout: 1200000
          state-name: zonixpharma-ftp-deploy-state
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/public/storage
            **/public/storage/**
            **/tests/**
            **/.agents/**
            **/.specify/**
            **/specs/**
            **/docs/**
            **/.github/**
            **/public/icons/svg/**
            **/_ide_helper*
            **/.cursor*

      - name: Set directory permissions
        run: |
          echo "Setting up directory permissions for shared hosting..."
          chmod -R 755 storage bootstrap/cache

      - name: Create storage link
        run: php artisan storage:link || echo "Storage link skipped on runner"

      - name: Verify deployment
        run: |
          echo "Verifying https://zonixpharma.com ..."
          curl -fsS --retry 3 --retry-delay 5 \
            https://zonixpharma.com/api/ping \
            || echo "WARN: /api/ping not reachable yet (first deploy may need migrate + docroot + .env on server)"
